[package]
name = "universal_db"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
rocksdb = "0.22"
tokio = { version = "1.0", features = ["full"] }
rayon = "1.7"
parking_lot = "0.12"
criterion = "0.5"
